schema_version: "1.0"
profile_id: fixture-am1
profile_version: "1.0"
phase: 1
support: executable
acquisition_model: AM-1
specification:
  schema_version: "1.0"
  specification_id: fixture-am1-spec
  specification_version: "1.0"
  acquisition_model: AM-1
  objective:
    statement: Monitor a fixed publication feed.
    expected_knowledge_product: classified_publications
  target:
    type: topics
    topics:
      - engineering
  scope:
    strategy: enumerate
    frontier:
      items:
        - https://example.com/feed
    source_types:
      - feed
    time_window:
      mode: since_last_run
  evaluation:
    dimensions:
      - topic_match
    decision_policy:
      schema_version: "1.0"
      policy_id: fixture-am1-policy
      policy_version: "1.0"
      rules:
        - decision: QUALIFIED
          all:
            - dimension: topic_match
              operator: gte
              value: 0.7
      fallback: REJECTED
  preservation:
    schema_version: "1.0"
    acquired_artifact: evidence_fragments
    derived_knowledge: claims
    observation_history: latest_only
  termination:
    completion_dimensions:
      - window_coverage
    success_conditions:
      - dimension: window_coverage
        operator: gte
        value: 1.0
    stop_conditions:
      - window_complete
