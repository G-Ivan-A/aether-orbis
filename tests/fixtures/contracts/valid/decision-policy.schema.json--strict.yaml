schema_version: "1.0"
policy_id: strict-policy
policy_version: "1.0"
rules:
  - decision: QUALIFIED
    all:
      - dimension: topic_match
        operator: gte
        value: 0.9
      - dimension: source_quality
        operator: gte
        value: 0.8
  - decision: CONDITIONAL
    all:
      - dimension: topic_match
        operator: gte
        value: 0.7
fallback: REJECTED
