# Phase 1 executable profile: AM-1 Domain Monitoring.
schema_version: "1.0"
profile_id: hub-practice-analysis
profile_version: "1.0"
phase: 1
support: executable
acquisition_model: AM-1
specification:
  schema_version: "1.0"
  specification_id: hub-practice-analysis
  specification_version: "1.0"
  acquisition_model: AM-1
  objective:
    statement: >-
      Monitor Habr publications for engineering and research practices relevant
      to the hybrid-Intelligence-lab standards.
    expected_knowledge_product: classified_publications
  target:
    type: topics
    topics:
      - software architecture
      - research methodology
      - knowledge engineering
  scope:
    strategy: enumerate
    frontier:
      items:
        - https://habr.com/ru/feed/
    source_types:
      - feed
      - web_page
    time_window:
      mode: since_last_run
  evaluation:
    dimensions:
      - source_authority
      - technical_specificity
      - evidence_strength
      - novelty
      - applicability
    decision_policy:
      schema_version: "1.0"
      policy_id: hub-practice-selection
      policy_version: "1.0"
      rules:
        - decision: QUALIFIED
          all:
            - dimension: technical_specificity
              operator: gte
              value: 0.7
            - dimension: evidence_strength
              operator: gte
              value: 0.7
            - dimension: applicability
              operator: gte
              value: 0.6
        - decision: CONDITIONAL
          all:
            - dimension: technical_specificity
              operator: gte
              value: 0.5
            - dimension: evidence_strength
              operator: gte
              value: 0.5
      fallback: REJECTED
  preservation:
    schema_version: "1.0"
    profile: monitoring
    acquired_artifact: evidence_fragments
    derived_knowledge: claims
    observation_history: latest_only
  termination:
    completion_dimensions:
      - window_coverage
      - unresolved_conflicts
    success_conditions:
      - dimension: window_coverage
        operator: gte
        value: 1.0
      - dimension: unresolved_conflicts
        operator: eq
        value: 0
    stop_conditions:
      - window_complete
      - budget_exhausted
