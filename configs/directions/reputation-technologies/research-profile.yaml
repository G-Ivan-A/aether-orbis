# Phase 1 executable profile: AM-2 Entity / Relationship Extraction.
schema_version: "1.0"
profile_id: reputation-technologies
profile_version: "1.0"
phase: 1
support: executable
acquisition_model: AM-2
specification:
  schema_version: "1.0"
  specification_id: reputation-technologies
  specification_version: "1.0"
  acquisition_model: AM-2
  objective:
    statement: >-
      Build an evidence-backed entity and relationship neighborhood for
      reputation technologies and the organizations that apply them.
    expected_knowledge_product: entity_relationship_graph
  target:
    type: entities
    seed_entities:
      - Global Reputation Alliance
    relation_types:
      - member_of
      - partnered_with
      - applies_technology
  scope:
    strategy: expand
    frontier:
      seeds:
        - Global Reputation Alliance
      relation_hints:
        - member
        - partner
        - technology
    source_types:
      - organization_site
      - registry
      - web_page
    time_window:
      mode: current
  evaluation:
    dimensions:
      - source_authority
      - evidence_strength
      - independence
      - applicability
    decision_policy:
      schema_version: "1.0"
      policy_id: reputation-technology-selection
      policy_version: "1.0"
      rules:
        - decision: QUALIFIED
          all:
            - dimension: source_authority
              operator: gte
              value: 0.7
            - dimension: evidence_strength
              operator: gte
              value: 0.8
            - dimension: independence
              operator: gte
              value: 0.5
        - decision: CONDITIONAL
          all:
            - dimension: evidence_strength
              operator: gte
              value: 0.6
      fallback: REJECTED
  preservation:
    schema_version: "1.0"
    profile: graph
    acquired_artifact: metadata
    derived_knowledge: full_knowledge_product
    observation_history: latest_only
    reproducibility_risk_accepted: true
  termination:
    completion_dimensions:
      - neighborhood_completeness
      - new_entity_saturation
    success_conditions:
      - dimension: neighborhood_completeness
        operator: gte
        value: 0.85
      - dimension: new_entity_saturation
        operator: lte
        value: 0.05
    stop_conditions:
      - frontier_exhausted
      - budget_exhausted
      - no_progress
