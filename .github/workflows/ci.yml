# CI AetherOrbis: документация, границы репозитория и исполняемые контракты Phase 1.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    name: Docs and structure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate documentation file naming
        run: ./tools/validate-file-naming.sh
      - name: Validate frontmatter contract
        run: ./tools/validate-frontmatter.sh
      - name: Validate repository boundary (no runtime data)
        run: ./tools/validate-repo-boundary.sh

  test:
    name: Contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: python3 -m pip install --user --quiet -r requirements-dev.txt
      - name: Validate contract artifacts
        run: python3 tools/validate-contracts.py
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
